<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Նոր կյանք Երևանում - Առաքիչի Արկածները</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #2c3e50;
            border: 4px solid #f1c40f;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
            background: #34495e;
        }
        #ui-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
            pointer-events: none;
        }
        #order-panel {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background: rgba(44, 62, 80, 0.9);
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #f1c40f;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn:hover { background: #c0392b; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui-panel">
            <div>Հաշիվ/Գումար: <span id="money">0</span> ֏</div>
            <div>Վարկանիշ: <span id="reputation">100</span>%</div>
            <div>Կարգավիճակ: <span id="status">Փնտրում է պատվեր...</span></div>
        </div>

        <canvas id="gameCanvas" width="800" height="500"></canvas>

        <div id="order-panel">
            <div id="order-text">Պատվեր չկա։ Սեղմեք «Նոր պատվեր» ստանալու համար։</div>
            <button class="btn" onclick="getNewOrder()">Վերցնել պատվեր</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // խաղացողի և աշխարհի փոփոխականներ
    let player = {
        x: 400,
        y: 250,
        speed: 3,
        angle: 0, // 0-ից 7 (8 ռակուրսների համար)
        money: 0,
        reputation: 100
    };

    let currentOrder = null;
    let keys = {};

    // Ստեղնաշարի կառավարում
    window.addEventListener('keydown', (e) => keys[e.key] = true);
    window.addEventListener('keyup', (e) => keys[e.key] = false);

    function getNewOrder() {
        const streets = ["Կոմիտաս", "Մաշտոց", "Աբովյան", "Բաղրամյան", "Հյուսիսային պողոտա"];
        const fromStreet = streets[Math.floor(Math.random() * streets.length)];
        const toStreet = streets[Math.floor(Math.random() * streets.length)];
        const code = "A-" + Math.floor(100 + Math.random() * 900);

        currentOrder = {
            code: code,
            route: `${fromStreet} -> ${toStreet}`,
            reward: 1500
        };

        document.getElementById('order-text').innerHTML = `
            <b>Պատվեր #${code}</b><br>
            Ուղղություն՝ ${currentOrder.route}<br>
            Վարձատրություն՝ ${currentOrder.reward} ֏
        `;
        document.getElementById('status').innerText = "Առաքվում է...";
    }

    function update() {
        // Շարժման տրամաբանություն (Արասացում / Ուղղություն)
        let moving = false;
        if (keys['ArrowUp'] || keys['w']) {
            player.y -= player.speed;
            player.angle = 0; // Դիմաց
            moving = true;
        }
        if (keys['ArrowDown'] || keys['s']) {
            player.y += player.speed;
            player.angle = 4; // Հետև
            moving = true;
        }
        if (keys['ArrowLeft'] || keys['a']) {
            player.x -= player.speed;
            player.angle = 6; // Ձախ
            moving = true;
        }
        if (keys['ArrowRight'] || keys['d']) {
            player.x += player.speed;
            player.angle = 2; // Աջ
            moving = true;
        }

        // Սահմաններ
        if (player.x < 30) player.x = 30;
        if (player.x > canvas.width - 30) player.x = canvas.width - 30;
        if (player.y < 30) player.y = 30;
        if (player.y > canvas.height - 30) player.y = canvas.height - 30;
    }

    function draw() {
        // Մաքրել էկրանը (Երևանյան փողոցի ֆոն)
        ctx.fillStyle = '#2c3e50';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Գծել պայմանական փողոցներ (Խաչմերուկներ)
        ctx.strokeStyle = '#7f8c8d';
        ctx.lineWidth = 60;
        ctx.beginPath();
        ctx.moveTo(0, 250); ctx.lineTo(800, 250);
        ctx.moveTo(400, 0); ctx.lineTo(400, 500);
        ctx.stroke();

        // Ճանապարհային գծանշումներ
        ctx.strokeStyle = '#f1c40f';
        ctx.lineWidth = 2;
        ctx.setLineDash([10, 10]);
        ctx.beginPath();
        ctx.moveTo(0, 250); ctx.lineTo(800, 250);
        ctx.moveTo(400, 0); ctx.lineTo(400, 500);
        ctx.stroke();
        ctx.setLineDash([]);

        // Գծել շենքերը (կողային հատվածներ)
        ctx.fillStyle = '#34495e';
        ctx.fillRect(50, 50, 120, 120);
        ctx.fillRect(600, 50, 150, 120);
        ctx.fillRect(50, 330, 120, 120);
        ctx.fillRect(600, 330, 150, 120);

        // Գծել խաղացողին (Սկուտեր + Հնդիկ առաքիչի պայմանական նշան)
        ctx.save();
        ctx.translate(player.x, player.y);
        
        // Առաքիչի մարմին/սկուտեր (Այստեղ հետագայում կդրվի 8 ռակուրսներից մեկի PNG նկարը)
        ctx.fillStyle = '#e67e22';
        ctx.beginPath();
        ctx.arc(0, 0, 18, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`🛵 [${player.angle}]`, 0, -22);

        ctx.restore();
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>

</body>
</html>
