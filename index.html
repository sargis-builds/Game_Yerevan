<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<title>Երևանյան Առաքիչ — Prototype</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    overflow: hidden;
    background: #1a1a2e;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    color: #fff;
    user-select: none;
  }
  #game { width: 100vw; height: 100vh; display: block; }

  /* ==== HUD ==== */
  .hud {
    position: fixed;
    pointer-events: none;
    z-index: 10;
  }
  #topBar {
    top: 16px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.55);
    padding: 10px 22px;
    border-radius: 14px;
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.1);
    display: flex; gap: 24px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  #topBar span { color: #ffd166; }
  #topBar .label { color: #aaa; font-weight: 400; margin-right: 6px; }

  #mission {
    top: 80px; left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(135deg, #ff6b35, #f7931e);
    padding: 12px 28px;
    border-radius: 30px;
    font-size: 17px;
    font-weight: 700;
    box-shadow: 0 8px 24px rgba(255,107,53,0.4);
    transition: all 0.3s;
    text-align: center;
  }
  #mission.pickup { background: linear-gradient(135deg, #4facfe, #00f2fe); box-shadow: 0 8px 24px rgba(79,172,254,0.4); }
  #mission.deliver { background: linear-gradient(135deg, #f093fb, #f5576c); box-shadow: 0 8px 24px rgba(245,87,108,0.4); }

  #speedo {
    bottom: 24px; right: 24px;
    background: rgba(0,0,0,0.6);
    padding: 14px 22px;
    border-radius: 16px;
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.1);
    text-align: center;
  }
  #speedo .num { font-size: 32px; font-weight: 800; color: #ffd166; }
  #speedo .unit { font-size: 12px; color: #888; letter-spacing: 2px; }

  #minimap {
    bottom: 24px; left: 24px;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: rgba(0,0,0,0.6);
    border: 2px solid rgba(255,255,255,0.15);
    overflow: hidden;
    backdrop-filter: blur(8px);
  }
  #minimap canvas { width: 100%; height: 100%; }

  #controls {
    top: 16px; left: 16px;
    background: rgba(0,0,0,0.5);
    padding: 10px 16px;
    border-radius: 12px;
    font-size: 12px;
    color: #aaa;
    line-height: 1.7;
    backdrop-filter: blur(8px);
  }
  #controls b { color: #ffd166; }

  #toast {
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: rgba(0,0,0,0.85);
    padding: 20px 40px;
    border-radius: 20px;
    font-size: 24px;
    font-weight: 800;
    color: #ffd166;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    border: 2px solid #ffd166;
  }
  #toast.show { transform: translate(-50%, -50%) scale(1); }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div class="hud" id="topBar">
  <div><span class="label">💰</span><span id="score">0</span></div>
  <div><span class="label">📦</span><span id="delivered">0</span></div>
  <div><span class="label">⏱️</span><span id="timer">0:00</span></div>
</div>

<div class="hud" id="mission">Գնա՛ պատվերի կետ 📍</div>

<div class="hud" id="controls">
  <b>W</b> / <b>↑</b> — արագացնել<br>
  <b>S</b> / <b>↓</b> — արգելակ<br>
  <b>A</b> / <b>←</b> — ձախ<br>
  <b>D</b> / <b>→</b> — աջ<br>
  <b>Space</b> — ձեռքի արգելակ
</div>

<div class="hud" id="speedo">
  <div class="num" id="speedNum">0</div>
  <div class="unit">KM/H</div>
</div>

<div class="hud" id="minimap"><canvas id="minimapCanvas" width="180" height="180"></canvas></div>

<div class="hud" id="toast">+10 💰</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ============================================================
//  ԵՐԵՎԱՆՅԱՆ ԱՌԱՔԻՉ — 2.5D Isometric Prototype
// ============================================================

// ---------- SCENE ----------
const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 80, 180);

// ---------- CAMERA (isometric 2.5D) ----------
const camera = new THREE.PerspectiveCamera(35, window.innerWidth/window.innerHeight, 0.1, 500);
const CAM_OFFSET = new THREE.Vector3(28, 32, 28); // isometric feel
const CAM_LOOK_OFFSET = new THREE.Vector3(0, 0, -3);

// ---------- LIGHTS ----------
const hemi = new THREE.HemisphereLight(0xffffff, 0x6688aa, 0.9);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff2cc, 1.2);
sun.position.set(40, 60, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -80;
sun.shadow.camera.right = 80;
sun.shadow.camera.top = 80;
sun.shadow.camera.bottom = -80;
sun.shadow.camera.far = 200;
scene.add(sun);

// ---------- GROUND ----------
const groundGeo = new THREE.PlaneGeometry(400, 400);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x6ab04c });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- STREET NETWORK ----------
// Փողոցների ցանց (ուղիղ ուղղանկյուններ)
const STREETS = [
  // Horizontal streets (x-range, z)
  { x1: -80, x2: 80, z1: -3, z2: 3 },   // Main Ave
  { x1: -80, x2: 80, z1: -33, z2: -27 },
  { x1: -80, x2: 80, z1: -63, z2: -57 },
  { x1: -80, x2: 80, z1: 27, z2: 33 },
  { x1: -80, x2: 80, z1: 57, z2: 63 },
  // Vertical streets (z-range, x)
  { z1: -80, z2: 80, x1: -3, x2: 3 },
  { z1: -80, z2: 80, x1: -33, x2: -27 },
  { z1: -80, z2: 80, x1: -63, x2: -57 },
  { z1: -80, z2: 80, x1: 27, x2: 33 },
  { z1: -80, z2: 80, x1: 57, x2: 63 },
];

const streetMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3a });
const sidewalkMat = new THREE.MeshStandardMaterial({ color: 0xb8b8b8 });

STREETS.forEach(s => {
  const w = s.x2 - s.x1;
  const d = s.z2 - s.z1;
  const cx = (s.x1 + s.x2) / 2;
  const cz = (s.z1 + s.z2) / 2;

  // Road
  const road = new THREE.Mesh(new THREE.BoxGeometry(w, 0.05, d), streetMat);
  road.position.set(cx, 0.03, cz);
  road.receiveShadow = true;
  scene.add(road);

  // Sidewalks (thin strips on each side)
  const sw = 0.8;
  if (w > d) {
    // horizontal
    const s1 = new THREE.Mesh(new THREE.BoxGeometry(w, 0.15, sw), sidewalkMat);
    s1.position.set(cx, 0.08, s.z1 - sw/2);
    s1.receiveShadow = true; scene.add(s1);
    const s2 = s1.clone(); s2.position.z = s.z2 + sw/2; scene.add(s2);
  } else {
    const s1 = new THREE.Mesh(new THREE.BoxGeometry(sw, 0.15, d), sidewalkMat);
    s1.position.set(s.x1 - sw/2, 0.08, cz);
    s1.receiveShadow = true; scene.add(s1);
    const s2 = s1.clone(); s2.position.x = s.x2 + sw/2; scene.add(s2);
  }

  // Road center dashes
  const dashCount = Math.floor(Math.max(w, d) / 6);
  for (let i = 0; i < dashCount; i++) {
    const dash = new THREE.Mesh(
      new THREE.BoxGeometry(w > d ? 2 : 0.15, 0.06, w > d ? 0.15 : 2),
      new THREE.MeshStandardMaterial({ color: 0xffdd55 })
    );
    const t = (i + 0.5) / dashCount;
    if (w > d) dash.position.set(s.x1 + w * t, 0.06, cz);
    else dash.position.set(cx, 0.06, s.z1 + d * t);
    scene.add(dash);
  }
});

// ---------- BUILDINGS ----------
// Շենքեր՝ բլոկների միջև
const buildingColors = [0xd4a373, 0xccd5ae, 0xe9edc9, 0xfaedcd, 0xb08968, 0xa68a6d, 0xc9ada7];
const buildings = []; // for collision

function addBuilding(x, z, w, d, h) {
  const color = buildingColors[Math.floor(Math.random() * buildingColors.length)];
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.9 });
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  b.position.set(x, h/2, z);
  b.castShadow = true;
  b.receiveShadow = true;
  scene.add(b);

  // Roof
  const roofMat = new THREE.MeshStandardMaterial({ color: 0x8b5a3c });
  const roof = new THREE.Mesh(new THREE.BoxGeometry(w + 0.4, 0.4, d + 0.4), roofMat);
  roof.position.set(x, h + 0.2, z);
  roof.castShadow = true;
  scene.add(roof);

  // Windows (simple)
  const winMat = new THREE.MeshStandardMaterial({ color: 0x88ccff, emissive: 0x224466, emissiveIntensity: 0.3 });
  const rows = Math.floor(h / 3);
  const cols = Math.floor(w / 3);
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const win = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.6, 0.1), winMat);
      win.position.set(x - w/2 + 1.5 + c * 3, 2 + r * 3, z + d/2 + 0.05);
      scene.add(win);
    }
  }

  buildings.push({ x, z, w, d, h });
}

// Generate buildings in blocks between streets
const blockCenters = [];
const xs = [-80, -63, -57, -33, -27, -3, 3, 27, 33, 57, 63, 80];
const zs = [-80, -63, -57, -33, -27, -3, 3, 27, 33, 57, 63, 80];

// Blocks between streets
for (let i = 0; i < xs.length - 1; i += 2) {
  for (let j = 0; j < zs.length - 1; j += 2) {
    const bx1 = xs[i+1], bx2 = xs[i+2];
    const bz1 = zs[j+1], bz2 = zs[j+2];
    if (bx2 - bx1 < 5 || bz2 - bz1 < 5) continue;

    const cx = (bx1 + bx2) / 2;
    const cz = (bz1 + bz2) / 2;
    const bw = (bx2 - bx1) * 0.7;
    const bd = (bz2 - bz1) * 0.7;
    const h = 6 + Math.random() * 12;
    addBuilding(cx, cz, bw, bd, h);
  }
}

// ---------- LANDMARKS ----------
// Կասկադի նման սանդղավոր կառույց
function addCascade(x, z) {
  const group = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: 0xf5e6d3, roughness: 0.8 });
  for (let i = 0; i < 5; i++) {
    const step = new THREE.Mesh(new THREE.B
