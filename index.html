<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Երևանյան Առաքիչ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0f0f1e;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    color: #fff; user-select: none;
  }
  #game { width: 100vw; height: 100vh; display: block; }

  .hud { position: fixed; pointer-events: none; z-index: 10; }

  #topBar {
    top: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.6);
    padding: 12px 26px; border-radius: 16px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.12);
    display: flex; gap: 28px;
    font-size: 15px; font-weight: 600;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  #topBar .item { display: flex; align-items: center; gap: 8px; }
  #topBar .label { color: #888; font-weight: 400; }
  #topBar .value { color: #ffd166; font-weight: 800; font-size: 17px; }

  #mission {
    top: 84px; left: 50%; transform: translateX(-50%);
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    padding: 14px 32px; border-radius: 32px;
    font-size: 17px; font-weight: 700;
    box-shadow: 0 10px 30px rgba(79,172,254,0.5);
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    text-align: center; letter-spacing: 0.3px;
  }
  #mission.deliver {
    background: linear-gradient(135deg, #f093fb, #f5576c);
    box-shadow: 0 10px 30px rgba(245,87,108,0.5);
  }

  #speedo {
    bottom: 28px; right: 28px;
    background: rgba(0,0,0,0.65);
    padding: 16px 26px; border-radius: 18px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.12);
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  #speedo .num {
    font-size: 38px; font-weight: 900;
    color: #ffd166; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  #speedo .unit {
    font-size: 11px; color: #888;
    letter-spacing: 3px; margin-top: 4px;
  }

  #minimap {
    bottom: 28px; left: 28px;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: rgba(0,0,0,0.65);
    border: 3px solid rgba(255,255,255,0.15);
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  #minimap canvas { width: 100%; height: 100%; display: block; }

  #controls {
    top: 16px; left: 16px;
    background: rgba(0,0,0,0.55);
    padding: 12px 18px; border-radius: 14px;
    font-size: 12px; color: #aaa;
    line-height: 1.8;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08);
  }
  #controls b { color: #ffd166; font-weight: 700; }

  #toast {
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: rgba(0,0,0,0.9);
    padding: 24px 48px; border-radius: 24px;
    font-size: 28px; font-weight: 900;
    color: #ffd166;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    border: 3px solid #ffd166;
    box-shadow: 0 20px 60px rgba(255,209,102,0.4);
    pointer-events: none;
  }
  #toast.show { transform: translate(-50%, -50%) scale(1); }

  #startScreen {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 100; transition: opacity 0.6s;
  }
  #startScreen.hide { opacity: 0; pointer-events: none; }
  #startScreen h1 {
    font-size: 56px; font-weight: 900;
    margin-bottom: 16px;
    background: linear-gradient(135deg, #ffd166, #ff6b35);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -1px;
  }
  #startScreen p {
    color: #888; font-size: 18px;
    margin-bottom: 40px;
  }
  #startBtn {
    background: linear-gradient(135deg, #ff6b35, #f7931e);
    border: none; color: #fff;
    font-size: 20px; font-weight: 800;
    padding: 18px 60px; border-radius: 40px;
    cursor: pointer;
    box-shadow: 0 12px 40px rgba(255,107,53,0.5);
    transition: transform 0.2s;
    font-family: inherit;
  }
  #startBtn:hover { transform: scale(1.05); }
  #startBtn:active { transform: scale(0.98); }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="startScreen">
  <h1>🛵 Երևանյան Առաքիչ</h1>
  <p>Սամակատով առաքիր պատվերները Երևանի փողոցներով</p>
  <button id="startBtn">ՍԿՍԵԼ ԽԱՂԸ</button>
</div>

<div class="hud" id="topBar">
  <div class="item"><span class="label">💰</span><span class="value" id="score">0</span></div>
  <div class="item"><span class="label">📦</span><span class="value" id="delivered">0</span></div>
  <div class="item"><span class="label">⏱️</span><span class="value" id="timer">0:00</span></div>
</div>

<div class="hud" id="mission">Գնա՛ պատվերի կետ 📍</div>

<div class="hud" id="controls">
  <b>W</b> / <b>↑</b> — արագացնել<br>
  <b>S</b> / <b>↓</b> — արգելակ<br>
  <b>A</b> / <b>←</b> — ձախ<br>
  <b>D</b> / <b>→</b> — աջ<br>
  <b>Space</b> — ձեռքի արգելակ
</div>

<div class="hud" id="speedo">
  <div class="num" id="speedNum">0</div>
  <div class="unit">KM/H</div>
</div>

<div class="hud" id="minimap">
  <canvas id="minimapCanvas" width="200" height="200"></canvas>
</div>

<div class="hud" id="toast">+10 💰</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">

import * as THREE from 'three';

// === ՄԱՍ 2 — THREE.JS SETUP + LIGHTS + GROUND ===

// ========== RENDERER ==========
const canvas = document.getElementById('game');

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  powerPreference: 'high-performance'
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

// ========== SCENE ==========
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 100, 240);

// ========== CAMERA (2.5D Isometric) ==========
const camera = new THREE.PerspectiveCamera(
  35,
  window.innerWidth / window.innerHeight,
  0.1,
  600
);

// Isometric offset — տեսախցիկը միշտ խաղացողից այս հեռավորության վրա
const CAM_OFFSET = new THREE.Vector3(34, 42, 34);
const CAM_LOOK_OFFSET = new THREE.Vector3(0, 0, -4);

// Սկզբնական դիրք
camera.position.copy(CAM_OFFSET);
camera.lookAt(0, 0, 0);

// ========== LIGHTS ==========
// Ambient / hemisphere — ընդհանուր լույս
const hemi = new THREE.HemisphereLight(0xffffff, 0x6688aa, 0.9);
scene.add(hemi);

// Արև — ուղղորդված լույս ստվերներով
const sun = new THREE.DirectionalLight(0xfff2cc, 1.3);
sun.position.set(60, 90, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -140;
sun.shadow.camera.right = 140;
sun.shadow.camera.top = 140;
sun.shadow.camera.bottom = -140;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 300;
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.02;
scene.add(sun);

// Արևի թիրախը (կթարմացվի խաղացողի հետ)
const sunTarget = new THREE.Object3D();
scene.add(sunTarget);
sun.target = sunTarget;

// ========== GROUND ==========
const groundGeo = new THREE.PlaneGeometry(600, 600);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x6ab04c,
  roughness: 1,
  metalness: 0
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ========== DECORATIVE GRASS PATCHES ==========
// Փոքր կանաչ բծեր՝ գետնին բազմազանություն տալու համար
const grassMat = new THREE.MeshStandardMaterial({
  color: 0x7bc95f,
  roughness: 1
});
for (let i = 0; i < 60; i++) {
  const patch = new THREE.Mesh(
    new THREE.CircleGeometry(1 + Math.random() * 2, 8),
    grassMat
  );
  patch.rotation.x = -Math.PI / 2;
  patch.position.set(
    (Math.random() - 0.5) * 300,
    0.01,
    (Math.random() - 0.5) * 300
  );
  scene.add(patch);
}

// ========== RESIZE HANDLER ==========
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// === ՄԱՍ 3-ը կցվում է այստեղ ===

 /* ============================================================
   ՄԱՍ 3 — STREETS + SIDEWALKS + ROAD MARKINGS
   ============================================================ */

// ========== STREET NETWORK ==========
// Քաղաքը 200x200 մետր է, փողոցները ցանց են կազմում
// Ամեն փողոց 8 մետր լայնություն ունի

/* ============================================================
   ՄԱՍ 3 — STREETS + SIDEWALKS + ROAD MARKINGS (ՃՇՏՏՎԱԾ)
   ============================================================ */

// ========== STREET NETWORK ==========
// Փողոցները տարբեր լայնությունների են։
// Կենտրոնական պողոտան ամենալայնն է (14մ)։

const STREETS = [
  // Հորիզոնական փողոցներ (z-ը հաստատուն)
  { x1: -100, x2: 100, z1: -7,  z2: 7,   width: 14, type: 'avenue' },
  { x1: -100, x2: 100, z1: -41, z2: -31, width: 10, type: 'main' },
  { x1: -100, x2: 100, z1: -75, z2: -68, width: 7,  type: 'small' },
  { x1: -100, x2: 100, z1: 31,  z2: 41,  width: 10, type: 'main' },
  { x1: -100, x2: 100, z1: 68,  z2: 75,  width: 7,  type: 'small' },

  // Ուղղահայաց փողոցներ (x-ը հաստատուն)
  { z1: -100, z2: 100, x1: -7,  x2: 7,   width: 14, type: 'avenue' },
  { z1: -100, z2: 100, x1: -41, x2: -31, width: 10, type: 'main' },
  { z1: -100, z2: 100, x1: -75, x2: -68, width: 7,  type: 'small' },
  { z1: -100, z2: 100, x1: 31,  x2: 41,  width: 10, type: 'main' },
  { z1: -100, z2: 100, x1: 68,  x2: 75,  width: 7,  type: 'small' },
];

// ========== MATERIALS ==========
const streetMat = new THREE.MeshStandardMaterial({
  color: 0x3a3a3a,
  roughness: 0.95,
  metalness: 0
});

const avenueMat = new THREE.MeshStandardMaterial({
  color: 0x353535,
  roughness: 0.9,
  metalness: 0
});

const sidewalkMat = new THREE.MeshStandardMaterial({
  color: 0xb8b8b8,
  roughness: 0.9,
  metalness: 0
});

const curbMat = new THREE.MeshStandardMaterial({
  color: 0x888888,
  roughness: 0.85
});

const dashMat = new THREE.MeshStandardMaterial({
  color: 0xffdd55,
  emissive: 0x443300,
  emissiveIntensity: 0.4,
  roughness: 0.6
});

const crosswalkMat = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  roughness: 0.8
});

// ========== SIDEWALK DATA (for collision) ==========
// Մայթերի տվյալները կոլիզիայի համար
const sidewalks = [];

// ========== BUILD STREETS ==========
STREETS.forEach(s => {
  const w = s.x2 - s.x1;
  const d = s.z2 - s.z1;
  const cx = (s.x1 + s.x2) / 2;
  const cz = (s.z1 + s.z2) / 2;
  const isHorizontal = w > d;

  // --- Road surface ---
  const roadMat = s.type === 'avenue' ? avenueMat : streetMat;
  const road = new THREE.Mesh(
    new THREE.BoxGeometry(w, 0.05, d),
    roadMat
  );
  road.position.set(cx, 0.03, cz);
  road.receiveShadow = true;
  scene.add(road);

  // --- Sidewalks (2 կողմից) ---
  const sw = 1.5;
  const swHeight = 0.25;

  if (isHorizontal) {
    // Վերին մայթ (հյուսիս)
    const s1 = new THREE.Mesh(
      new THREE.BoxGeometry(w, swHeight, sw),
      sidewalkMat
    );
    s1.position.set(cx, swHeight / 2, s.z1 - sw / 2);
    s1.receiveShadow = true;
    s1.castShadow = true;
    scene.add(s1);

    // Ներքևի մայթ (հարավ)
    const s2 = new THREE.Mesh(
      new THREE.BoxGeometry(w, swHeight, sw),
      sidewalkMat
    );
    s2.position.set(cx, swHeight / 2, s.z2 + sw / 2);
    s2.receiveShadow = true;
    s2.castShadow = true;
    scene.add(s2);

    // Կոլիզիայի տվյալներ
    sidewalks.push({
      minX: s.x1, maxX: s.x2,
      minZ: s.z1 - sw, maxZ: s.z1
    });
    sidewalks.push({
      minX: s.x1, maxX: s.x2,
      minZ: s.z2, maxZ: s.z2 + sw
    });

    // Curb (եզրաքար) — վերին
    const curb1 = new THREE.Mesh(
      new THREE.BoxGeometry(w, 0.3, 0.15),
      curbMat
    );
    curb1.position.set(cx, 0.15, s.z1 - 0.075);
    curb1.castShadow = true;
    scene.add(curb1);

    // Curb — ներքևի
    const curb2 = new THREE.Mesh(
      new THREE.BoxGeometry(w, 0.3, 0.15),
      curbMat
    );
    curb2.position.set(cx, 0.15, s.z2 + 0.075);
    curb2.castShadow = true;
    scene.add(curb2);
  } else {
    // Ձախ մայթ (արևմուտք)
    const s1 = new THREE.Mesh(
      new THREE.BoxGeometry(sw, swHeight, d),
      sidewalkMat
    );
    s1.position.set(s.x1 - sw / 2, swHeight / 2, cz);
    s1.receiveShadow = true;
    s1.castShadow = true;
    scene.add(s1);

    // Աջ մայթ (արևելք)
    const s2 = new THREE.Mesh(
      new THREE.BoxGeometry(sw, swHeight, d),
      sidewalkMat
    );
    s2.position.set(s.x2 + sw / 2, swHeight / 2, cz);
    s2.receiveShadow = true;
    s2.castShadow = true;
    scene.add(s2);

    // Կոլիզիայի տվյալներ
    sidewalks.push({
      minX: s.x1 - sw, maxX: s.x1,
      minZ: s.z1, maxZ: s.z2
    });
    sidewalks.push({
      minX: s.x2, maxX: s.x2 + sw,
      minZ: s.z1, maxZ: s.z2
    });

    // Curb — ձախ
    const curb1 = new THREE.Mesh(
      new THREE.BoxGeometry(0.15, 0.3, d),
      curbMat
    );
    curb1.position.set(s.x1 - 0.075, 0.15, cz);
    curb1.castShadow = true;
    scene.add(curb1);

    // Curb — աջ
    const curb2 = new THREE.Mesh(
      new THREE.BoxGeometry(0.15, 0.3, d),
      curbMat
    );
    curb2.position.set(s.x2 + 0.075, 0.15, cz);
    curb2.castShadow = true;
    scene.add(curb2);
  }

  // --- Center dashed line ---
  // Միայն մեծ փողոցների ու պողոտայի վրա
  if (s.type === 'avenue' || s.type === 'main') {
    const length = Math.max(w, d);
    const dashCount = Math.floor(length / 8);
    const dashLength = 3;

    for (let i = 0; i < dashCount; i++) {
      const t = (i + 0.5) / dashCount;
      const dash = new THREE.Mesh(
        new THREE.BoxGeometry(
          isHorizontal ? dashLength : 0.2,
          0.06,
          isHorizontal ? 0.2 : dashLength
        ),
        dashMat
      );

      if (isHorizontal) {
        dash.position.set(s.x1 + w * t, 0.06, cz);
      } else {
        dash.position.set(cx, 0.06, s.z1 + d * t);
      }
      scene.add(dash);
    }
  }

  // --- Avenue side lines ---
  if (s.type === 'avenue') {
    const lineMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      emissive: 0x333333,
      emissiveIntensity: 0.2
    });

    if (isHorizontal) {
      const line1 = new THREE.Mesh(
        new THREE.BoxGeometry(w, 0.06, 0.15),
        lineMat
      );
      line1.position.set(cx, 0.06, s.z1 + 0.5);
      scene.add(line1);

      const line2 = new THREE.Mesh(
        new THREE.BoxGeometry(w, 0.06, 0.15),
        lineMat
      );
      line2.position.set(cx, 0.06, s.z2 - 0.5);
      scene.add(line2);
    } else {
      const line1 = new THREE.Mesh(
        new THREE.BoxGeometry(0.15, 0.06, d),
        lineMat
      );
      line1.position.set(s.x1 + 0.5, 0.06, cz);
      scene.add(line1);

      const line2 = new THREE.Mesh(
        new THREE.BoxGeometry(0.15, 0.06, d),
        lineMat
      );
      line2.position.set(s.x2 - 0.5, 0.06, cz);
      scene.add(line2);
    }
  }
});

// ========== CROSSWALKS AT INTERSECTIONS ==========
const intersections = [];

const hStreets = STREETS.filter(s => (s.x2 - s.x1) > (s.z2 - s.z1));
const vStreets = STREETS.filter(s => (s.z2 - s.z1) > (s.x2 - s.x1));

hStreets.forEach(h => {
  vStreets.forEach(v => {
    const cx = (v.x1 + v.x2) / 2;
    const cz = (h.z1 + h.z2) / 2;
    intersections.push({
      x: cx,
      z: cz,
      hw: (v.x2 - v.x1) / 2,
      hh: (h.z2 - h.z1) / 2
    });
  });
});

// Ամեն խաչմերուկում zebra-ներ 4 ուղղությամբ
intersections.forEach(inter => {
  const stripeCount = 4;
  const stripeW = 0.7;
  const stripeGap = 0.6;

  for (let i = 0; i < stripeCount; i++) {
    const offset = (i - (stripeCount - 1) / 2) * (stripeW + stripeGap);

    // Հյուսիս
    const z1 = new THREE.Mesh(
      new THREE.BoxGeometry(stripeW, 0.07, inter.hh * 0.8),
      crosswalkMat
    );
    z1.position.set(inter.x + offset, 0.07, inter.z - inter.hh - 1.5);
    scene.add(z1);

    // Հարավ
    const z2 = new THREE.Mesh(
      new THREE.BoxGeometry(stripeW, 0.07, inter.hh * 0.8),
      crosswalkMat
    );
    z2.position.set(inter.x + offset, 0.07, inter.z + inter.hh + 1.5);
    scene.add(z2);

    // Արևմուտք
    const z3 = new THREE.Mesh(
      new THREE.BoxGeometry(inter.hw * 0.8, 0.07, stripeW),
      crosswalkMat
    );
    z3.position.set(inter.x - inter.hw - 1.5, 0.07, inter.z + offset);
    scene.add(z3);

    // Արևելք
    const z4 = new THREE.Mesh(
      new THREE.BoxGeometry(inter.hw * 0.8, 0.07, stripeW),
      crosswalkMat
    );
    z4.position.set(inter.x + inter.hw + 1.5, 0.07, inter.z + offset);
    scene.add(z4);
  }
});

// ========== STREET LIGHTS ==========
const poleMat = new THREE.MeshStandardMaterial({
  color: 0x2a2a2a,
  roughness: 0.7,
  metalness: 0.5
});
const lampMat = new THREE.MeshStandardMaterial({
  color: 0xfff2cc,
  emissive: 0xffdd88,
  emissiveIntensity: 0.6
});

intersections.forEach(inter => {
  const corners = [
    { dx: -1, dz: -1 },
    { dx: 1, dz: -1 },
    { dx: -1, dz: 1 },
    { dx: 1, dz: 1 }
  ];

  corners.forEach(c => {

// ========== BUILDING COLORS ==========
// Երևանի շենքերի գույներ — բեժ, կրեմ, դարչնագույն, մոխրագույն
/* ============================================================
   ՄԱՍ 4 — BUILDINGS + LANDMARKS (ՃՇՏՏՎԱԾ)

// ========== BUILDING COLORS ==========
const buildingColors = [
  0xd4a373, 0xccd5ae, 0xe9edc9, 0xfaedcd,
  0xb08968, 0xa68a6d, 0xc9ada7, 0xe8d5b7,
  0xd9bfa3, 0xc4a484, 0xbfa980, 0xe6d5b8
];

const roofColors = [0x8b5a3c, 0x6b4423, 0x7a5c3f, 0x5c4033];

// Կոլիզիայի տվյալներ — ամեն շենք կունենա AABB box
const buildings = [];

// ========== BUILDING FACTORY ==========
function addBuilding(x, z, w, d, h) {
  // Անվտանգության ստուգում
  if (!isFinite(x) || !isFinite(z) || !isFinite(w) || !isFinite(d) || !isFinite(h)) {
    console.warn('addBuilding: invalid params', { x, z, w, d, h });
    return;
  }
  if (w <= 0 || d <= 0 || h <= 0) {
    console.warn('addBuilding: non-positive size', { x, z, w, d, h });
    return;
  }

  const color = buildingColors[Math.floor(Math.random() * buildingColors.length)];
  const roofColor = roofColors[Math.floor(Math.random() * roofColors.length)];

  // --- Main body ---
  const bodyMat = new THREE.MeshStandardMaterial({
    color,
    roughness: 0.9,
    metalness: 0
  });
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    bodyMat
  );
  body.position.set(x, h / 2, z);
  body.castShadow = true;
  body.receiveShadow = true;
  scene.add(body);

  // --- Roof ---
  const roof = new THREE.Mesh(
    new THREE.BoxGeometry(w + 0.6, 0.5, d + 0.6),
    new THREE.MeshStandardMaterial({ color: roofColor, roughness: 0.85 })
  );
  roof.position.set(x, h + 0.25, z);
  roof.castShadow = true;
  scene.add(roof);

  // --- Windows on all 4 sides ---
  const winMat = new THREE.MeshStandardMaterial({
    color: 0x88ccff,
    emissive: 0x224466,
    emissiveIntensity: 0.5,
    roughness: 0.2,
    metalness: 0.3
  });

  const winW = 1.2;
  const winH = 1.6;
  const winGapX = 2.8;
  const winGapY = 3.2;
  const rows = Math.max(0, Math.floor((h - 2) / winGapY));
  const colsX = Math.max(0, Math.floor((w - 2) / winGapX));
  const colsZ = Math.max(0, Math.floor((d - 2) / winGapX));

  // Front (+Z) and Back (-Z) windows
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < colsX; c++) {
      const wx = x - w / 2 + 1.5 + c * winGapX;
      const wy = 2.5 + r * winGapY;

      const winF = new THREE.Mesh(
        new THREE.BoxGeometry(winW, winH, 0.1),
        winMat
      );
      winF.position.set(wx, wy, z + d / 2 + 0.06);
      scene.add(winF);

      const winB = new THREE.Mesh(
        new THREE.BoxGeometry(winW, winH, 0.1),
        winMat
      );
      winB.position.set(wx, wy, z - d / 2 - 0.06);
      scene.add(winB);
    }
  }

  // Left (-X) and Right (+X) windows
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < colsZ; c++) {
      const wz = z - d / 2 + 1.5 + c * winGapX;
      const wy = 2.5 + r * winGapY;

      const winL = new THREE.Mesh(
        new THREE.BoxGeometry(0.1, winH, winW),
        winMat
      );
      winL.position.set(x - w / 2 - 0.06, wy, wz);
      scene.add(winL);

      const winR = new THREE.Mesh(
        new THREE.BoxGeometry(0.1, winH, winW),
        winMat
      );
      winR.position.set(x + w / 2 + 0.06, wy, wz);
      scene.add(winR);
    }
  }

  // --- Save collision data ---
  buildings.push({
    x, z, w, d, h,
    minX: x - w / 2,
    maxX: x + w / 2,
    minZ: z - d / 2,
    maxZ: z + d / 2
  });
}

// ========== GENERATE BUILDINGS IN BLOCKS ==========
// ⚠️ ԿԱՐԵՎՈՐ՝ ՓՈՓՈԽՎԱԾ ՏՐԱՄԱԲԱՆՈՒԹՅՈՒՆ
//
// Փողոցների ցանցի կոորդինատները (նույնը ինչ Մաս 3-ում).
// Ամեն զույգ (xs[i], xs[i+1]) փողոցի 2 եզրերն են։
// Ամեն զույգ (xs[i+1], xs[i+2]) բլոկի 2 եզրերն են (շենքերի տեղը)։

const xs = [-100, -76, -68, -40, -32, -4, 4, 32, 40, 68, 76, 100];
const zs = [-100, -76, -68, -40, -32, -4, 4, 32, 40, 68, 76, 100];

// Բլոկները գտնվում են փողոցների ՄԻՋԵՎ։
// Ամեն բլոկ ունի 4 եզրեր՝
//   - ձախ փողոցի աջ եզր (xs[i+1])
//   - աջ փողոցի ձախ եզր (xs[i+2])
// Նույնը z-ի համար։

for (let i = 0; i < xs.length - 2; i += 2) {
  for (let j = 0; j < zs.length - 2; j += 2) {
    // Բլոկի սահմանները
    const blockMinX = xs[i + 1];  // ձախ փողոցի աջ եզր
    const blockMaxX = xs[i + 2];  // աջ փողոցի ձախ եզր
    const blockMinZ = zs[j + 1];
    const blockMaxZ = zs[j + 2];

    // Անվտանգության ստուգում
    if (blockMinX === undefined || blockMaxX === undefined) continue;
    if (blockMinZ === undefined || blockMaxZ === undefined) continue;

    const blockW = blockMaxX - blockMinX;
    const blockD = blockMaxZ - blockMinZ;

    if (!isFinite(blockW) || !isFinite(blockD)) continue;
    if (blockW < 6 || blockD < 6) continue;

    // Բլոկի կենտրոնը
    const cx = (blockMinX + blockMaxX) / 2;
    const cz = (blockMinZ + blockMaxZ) / 2;

    // ⚠️ ԿԱՐԵՎՈՐ՝ Շենքերը պետք է լինեն բլոկի ՆԵՐՍՈՒՄ
    // Մայթերից հետո մի փոքր տարածություն ենք թողնում
    const margin = 1.5;
    const usableW = blockW - margin * 2;
    const usableD = blockD - margin * 2;

    if (usableW < 4 || usableD < 4) continue;

    // 70% հավանականությամբ 1 մեծ շենք, 30%՝ 2 փոքր
    if (Math.random() < 0.7) {
      const bw = usableW * 0.9;
      const bd = usableD * 0.9;
      const h = 8 + Math.random() * 14;
      addBuilding(cx, cz, bw, bd, h);
    } else {
      // 2 շենք կողք-կողքի (X առանցքով)
      const bw = usableW * 0.42;
      const bd = usableD * 0.9;
      const h1 = 6 + Math.random() * 10;
      const h2 = 6 + Math.random() * 10;
      const offset = usableW * 0.25;
      addBuilding(cx - offset, cz, bw, bd, h1);
      addBuilding(cx + offset, cz, bw, bd, h2);
    }
  }
}

// ========== COLLISION DETECTION ==========
// Սամակատի մոտավոր շառավիղը
const PLAYER_RADIUS = 1.4;

// Ստուգում է, արդյոք դիրքը բախվում է որևէ շենքի
function checkCollision(x, z) {
  for (const b of buildings) {
    // AABB + շրջան collision
    const closestX = Math.max(b.minX, Math.min(x, b.maxX));
    const closestZ = Math.max(b.minZ, Math.min(z, b.maxZ));
    const dx = x - closestX;
    const dz = z - closestZ;
    const distSq = dx * dx + dz * dz;

    if (distSq < PLAYER_RADIUS * PLAYER_RADIUS) {
      return b; // բախվում է
    }
  }
  return null;
}

// Գտնում է ամենամոտ ազատ դիրքը բախման ժամանակ
function resolveCollision(oldX, oldZ, newX, newZ) {
  // Փորձում ենք նոր դիրքը
  if (!checkCollision(newX, newZ)) {
    return { x: newX, z: newZ };
  }

  // Փորձում ենք միայն X-ով շարժվել
  if (!checkCollision(newX, oldZ)) {
    return { x: newX, z: oldZ };
  }

  // Փորձում ենք միայն Z-ով շարժվել
  if (!checkCollision(oldX, newZ)) {
    return { x: oldX, z: newZ };
  }

  // Ամեն ինչ բախվում է — մնում ենք տեղում
  return { x: oldX, z: oldZ };
}

// ========== PHYSICS UPDATE ==========
function updatePhysics(dt) {
  // --- Acceleration / Braking ---
  if (keys.forward) {
    playerState.speed += playerState.acceleration * dt;
  } else if (keys.backward) {
    playerState.speed -= playerState.acceleration * dt;
  } else {
    // Friction — աստիճանաբար կանգ է առնում
    if (playerState.speed > 0) {
      playerState.speed -= playerState.friction * dt;
      if (playerState.speed < 0) playerState.speed = 0;
    } else if (playerState.speed < 0) {
      playerState.speed += playerState.friction * dt;
      if (playerState.speed > 0) playerState.speed = 0;
    }
  }

  // --- Handbrake ---
  if (keys.handbrake) {
    if (playerState.speed > 0) {
      playerState.speed -= playerState.brakeForce * dt;
      if (playerState.speed < 0) playerState.speed = 0;
    } else if (playerState.speed < 0) {
      playerState.speed += playerState.brakeForce * dt;
      if (playerState.speed > 0) playerState.speed = 0;
    }
  }

  // --- Speed limits ---
  if (playerState.speed > playerState.maxSpeed) {
    playerState.speed = playerState.maxSpeed;
  }
  if (playerState.speed < -playerState.reverseSpeed) {
    playerState.speed = -playerState.reverseSpeed;
  }

  // --- Steering ---
  // Արագության հետ կապված՝ դանդաղ ժամանակ ավելի դժվար շրջադարձ
  const speedFactor = Math.min(Math.abs(playerState.speed) / 8, 1);
  const turnAmount = playerState.turnSpeed * dt * speedFactor;

  if (keys.left) {
    playerState.heading += turnAmount;
  }
  if (keys.right) {
    playerState.heading -= turnAmount;
  }

  // --- Movement ---
  const oldX = player.position.x;
  const oldZ = player.position.z;

  const dx = Math.sin(playerState.heading) * playerState.speed * dt;
  const dz = Math.cos(playerState.heading) * playerState.speed * dt;

  const newX = oldX + dx;
  const newZ = oldZ + dz;

  // --- Collision resolution ---
  const resolved = resolveCollision(oldX, oldZ, newX, newZ);

  // Եթե բախվել է, արագությունը կտրուկ իջնում է
  if (resolved.x !== newX || resolved.z !== newZ) {
    playerState.speed *= 0.3;
  }

  player.position.x = resolved.x;
  player.position.z = resolved.z;

  // --- Apply rotation ---
  player.rotation.y = playerState.heading;

  // --- Wheel rotation ---
  const wheelRotation = playerState.speed * dt * 2;
  wheels.forEach(w => {
    w.rotation.x += wheelRotation;
  });

  // --- World boundaries ---
  const BOUND = 105;
  if (player.position.x > BOUND) player.position.x = BOUND;
  if (player.position.x < -BOUND) player.position.x = -BOUND;
  if (player.position.z > BOUND) player.position.z = BOUND;
  if (player.position.z < -BOUND) player.position.z = -BOUND;
}

// ========== CAMERA FOLLOW ==========
function updateCamera(dt) {
  // Թիրախ դիրքը՝ խաղացողից հետ CAM_OFFSET-ով
  const targetPos = new THREE.Vector3(
    player.position.x + CAM_OFFSET.x,
    CAM_OFFSET.y,
    player.position.z + CAM_OFFSET.z
  );

  // Հարթ հետևում (lerp)
  const lerpFactor = 1 - Math.pow(0.001, dt);
  camera.position.lerp(targetPos, lerpFactor);

  // Նայում է խաղացողի ուղղությամբ
  const lookAt = new THREE.Vector3(
    player.position.x + CAM_LOOK_OFFSET.x,
    0,
    player.position.z + CAM_LOOK_OFFSET.z
  );
  camera.lookAt(lookAt);

  // Արևը հետևում է խաղացողին (ստվերները միշտ աշխատեն)
  sun.position.set(
    player.position.x + 60,
    90,
    player.position.z + 40
  );
  sunTarget.position.copy(player.position);
}

// ========== RANDOM POSITION IN STREETS ==========
// Պատահական դիրք փողոցների վրա (շենքերից դուրս)
function getRandomStreetPosition() {
  const attempts = 50;

  for (let i = 0; i < attempts; i++) {
    // Ընտրում ենք պատահական փողոց
    const street = STREETS[Math.floor(Math.random() * STREETS.length)];
    const isHorizontal = (street.x2 - street.x1) > (street.z2 - street.z1);

    let x, z;
    if (isHorizontal) {
      x = street.x1 + Math.random() * (street.x2 - street.x1);
      z = (street.z1 + street.z2) / 2;
    } else {
      x = (street.x1 + street.x2) / 2;
      z = street.z1 + Math.random() * (street.z2 - street.z1);
    }

    // Ստուգում ենք, որ խաղացողից հեռու լինի
    const dx = x - player.position.x;
    const dz = z - player.position.z;
    const distSq = dx * dx + dz * dz;

    if (distSq < 400) continue; // 20մ-ից ավելի հեռու

    // Ստուգում ենք, որ շենք չլինի
    if (checkCollision(x, z)) continue;

    return { x, z };
  }

  // Fallback — վերադարձնում ենք կենտրոնական փողոցի կետ
  return { x: 0, z: 20 };
}

// ========== START NEW MISSION ==========
function startNewMission() {
  // Մաքրում ենք հին ցուցիչները
  if (mission.pickupMarker) {
    scene.remove(mission.pickupMarker);
    mission.pickupMarker = null;
  }
  if (mission.deliverMarker) {
    scene.remove(mission.deliverMarker);
    mission.deliverMarker = null;
  }

  // Նոր կետեր
  mission.pickupPoint = getRandomStreetPosition();
  mission.deliverPoint = getRandomStreetPosition();

  // Ստեղծում ենք ցուցիչները
  mission.pickupMarker = createMarker(0x4facfe, 'pickup');
  mission.pickupMarker.position.set(
    mission.pickupPoint.x,
    0,
    mission.pickupPoint.z
  );
  scene.add(mission.pickupMarker);

  mission.deliverMarker = createMarker(0xf5576c, 'deliver');
  mission.deliverMarker.position.set(
    mission.deliverPoint.x,
    0,
    mission.deliverPoint.z
  );
  // Սկզբում թաքցնում ենք deliver-ը
  mission.deliverMarker.visible = false;
  scene.add(mission.deliverMarker);

  // Փուլը՝ pickup
  mission.phase = 'pickup';
  updateMissionUI();
}

// ========== MISSION UI ==========
const missionEl = document.getElementById('mission');

function updateMissionUI() {
  if (mission.phase === 'pickup') {
    missionEl.textContent = '📍 Գնա՛ պատվերի կետ';
    missionEl.classList.remove('deliver');
  } else {
    missionEl.textContent = '📦 Հասցրու՛ հաճախորդին';
    missionEl.classList.add('deliver');
  }
}

// ========== CHECK MISSION PROGRESS ==========
function checkMissionProgress() {
  if (mission.phase === 'pickup' && mission.pickupPoint) {
    const dx = player.position.x - mission.pickupPoint.x;
    const dz = player.position.z - mission.pickupPoint.z;
    const distSq = dx * dx + dz * dz;

    if (distSq < mission.pickupRadius * mission.pickupRadius) {
      // Վերցրինք պատվերը
      mission.phase = 'deliver';
      mission.pickupMarker.visible = false;
      mission.deliverMarker.visible = true;
      updateMissionUI();
      showToast('📦 Պատվերը վերցվեց!');
    }
  } else if (mission.phase === 'deliver' && mission.deliverPoint) {
    const dx = player.position.x - mission.deliverPoint.x;
    const dz = player.position.z - mission.deliverPoint.z;
    const distSq = dx * dx + dz * dz;

    if (distSq < mission.deliverRadius * mission.deliverRadius) {
      // Առաքվեց
      completeDelivery();
    }
  }
}

 /* ============================================================

// ========== MINIMAP SETUP ==========
const minimapCanvas = document.getElementById('minimapCanvas');
const minimapCtx = minimapCanvas.getContext('2d');

const MINIMAP_SIZE = 200;
const MINIMAP_RADIUS = MINIMAP_SIZE / 2;
const MINIMAP_SCALE = 0.9; // 1 աշխարհի միավոր = 0.9 պիքսել

// ========== DRAW MINIMAP ==========
function drawMinimap() {
  const ctx = minimapCtx;
  const cx = MINIMAP_RADIUS;
  const cy = MINIMAP_RADIUS;

  // --- Clear ---
  ctx.clearRect(0, 0, MINIMAP_SIZE, MINIMAP_SIZE);

  // --- Background circle ---
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, MINIMAP_RADIUS - 2, 0, Math.PI * 2);
  ctx.clip();

  // Ֆոն
  ctx.fillStyle = '#2a3a2a';
  ctx.fillRect(0, 0, MINIMAP_SIZE, MINIMAP_SIZE);

  // --- Camera follows player ---
  const px = player.position.x;
  const pz = player.position.z;

  // World → Minimap coordinate helper
  function worldToMap(wx, wz) {
    return {
      x: cx + (wx - px) * MINIMAP_SCALE,
      y: cy + (wz - pz) * MINIMAP_SCALE
    };
  }

  // --- Draw streets ---
  ctx.strokeStyle = '#555555';
  ctx.lineWidth = 6;

  STREETS.forEach(s => {
    const p1 = worldToMap(s.x1, s.z1);
    const p2 = worldToMap(s.x2, s.z2);

    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();
  });

  // --- Draw buildings ---
  ctx.fillStyle = '#8a7a5a';
  buildings.forEach(b => {
    const p1 = worldToMap(b.minX, b.minZ);
    const p2 = worldToMap(b.maxX, b.maxZ);

    const w = p2.x - p1.x;
    const h = p2.y - p1.y;

    ctx.fillRect(p1.x, p1.y, w, h);
  });

  // --- Draw mission markers ---
  if (mission.phase === 'pickup' && mission.pickupPoint) {
    const p = worldToMap(mission.pickupPoint.x, mission.pickupPoint.z);
    drawMarkerDot(ctx, p.x, p.y, '#4facfe', 6);
  }

  if (mission.phase === 'deliver' && mission.deliverPoint) {
    const p = worldToMap(mission.deliverPoint.x, mission.deliverPoint.z);
    drawMarkerDot(ctx, p.x, p.y, '#f5576c', 6);
  }

  // --- Draw player (always at center) ---
  // Սլաք, որը ցույց է տալիս ուղղությունը
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(-playerState.heading);

  ctx.fillStyle = '#ffd166';
  ctx.beginPath();
  ctx.moveTo(0, -8);
  ctx.lineTo(-6, 6);
  ctx.lineTo(0, 3);
  ctx.lineTo(6, 6);
  ctx.closePath();
  ctx.fill();

  // Սահման
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.restore();

  ctx.restore();

  // --- Border ring ---
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(cx, cy, MINIMAP_RADIUS - 3, 0, Math.PI * 2);
  ctx.stroke();

  // --- North indicator ---
  ctx.fillStyle = '#ffd166';
  ctx.font = 'bold 12px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('N', cx, 14);
}

// ========== MARKER DOT HELPER ==========
function drawMarkerDot(ctx, x, y, color, radius) {
  // Արտաքին շող
  ctx.beginPath();
  ctx.arc(x, y, radius + 3, 0, Math.PI * 2);
  ctx.fillStyle = color + '44';
  ctx.fill();

  // Հիմնական կետ
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();

  // Սահման
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.stroke();
}

// ========== HUD UPDATE ==========
function updateHUD() {
  updateSpeedDisplay();
  updateTimer();
}

// ========== DIRECTION ARROW TO TARGET ==========
// Սլաք էկրանի վրա, որը ցույց է տալիս դեպի թիրախը
// (կցուցադրվի HUD-ի վրա, ոչ 3D-ում)

// Ստեղծում ենք DOM element
const arrowEl = document.createElement('div');
arrowEl.style.cssText = `
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 48px;
  color: #ffd166;
  text-shadow: 0 0 20px rgba(255,209,102,0.8);
  pointer-events: none;
  z-index: 9;
  opacity: 0;
  transition: opacity 0.3s;
  font-weight: 900;
`;
arrowEl.textContent = '⬆';
document.body.appendChild(arrowEl);

// ========== UPDATE DIRECTION ARROW ==========
function updateDirectionArrow() {
  let target = null;

  if (mission.phase === 'pickup' && mission.pickupPoint) {
    target = mission.pickupPoint;
  } else if (mission.phase === 'deliver' && mission.deliverPoint) {
    target = mission.deliverPoint;
  }

  if (!target) {
    arrowEl.style.opacity = '0';
    return;
  }

  // Հաշվում ենք ուղղությունը
  const dx = target.x - player.position.x;
  const dz = target.z - player.position.z;
  const dist = Math.sqrt(dx * dx + dz * dz);

  // Եթե շատ մոտ ենք, թաքցնում ենք
  if (dist < 6) {
    arrowEl.style.opacity = '0';
    return;
  }

  // Հաշվում ենք անկյունը էկրանի կոորդինատներում
  // Խաղի աշխարհում +Z-ը ներքև է, +X-ը աջ
  // Խաղացողի heading-ը 0 է, երբ նայում է +Z-ին
  const angleToTarget = Math.atan2(dx, dz);
  const relativeAngle = angleToTarget - playerState.heading;

  // Էկրանի անկյունը (0 = վերև)
  const screenAngle = -relativeAngle;

  // Դիրքավորում ենք սլաքը էկրանի կենտրոնից 120px հեռավորության վրա
  const radius = 120;
  const ax = Math.sin(screenAngle) * radius;
  const ay = -Math.cos(screenAngle) * radius;

  arrowEl.style.transform = `translate(calc(-50% + ${ax}px), calc(-50% + ${ay}px)) rotate(${screenAngle}rad)`;
  arrowEl.style.opacity = '0.85';
}

// ========== DISTANCE TO TARGET (optional display) ==========
// Կարող ենք ցուցադրել հեռավորությունը mission-ի տեքստում
function updateMissionDistance() {
  let target = null;
  if (mission.phase === 'pickup' && mission.pickupPoint) {
    target = mission.pickupPoint;
  } else if (mission.phase === 'deliver' && mission.deliverPoint) {
    target = mission.deliverPoint;
  }

  if (!target) return;

  const dx = target.x - player.position.x;
  const dz = target.z - player.position.z;
  const dist = Math.round(Math.sqrt(dx * dx + dz * dz));

  // Ավելացնում ենք հեռավորությունը mission-ի տեքստին
  const baseText = mission.phase === 'pickup'
    ? '📍 Գնա՛ պատվերի կետ'
    : '📦 Հասցրու՛ հաճախորդին';

  missionEl.textContent = `${baseText} — ${dist}մ`;
}

// === ՄԱՍ 9-ը կցվում է այստեղ ===

 /* ============================================================
   ՄԱՍ 9 — GAME LOOP + FINAL WIRING
   ============================================================ */

// ========== CLOCK ==========
const clock = new THREE.Clock();

// ========== GAME LOOP ==========
let animationId = null;

function gameLoop() {
  animationId = requestAnimationFrame(gameLoop);

  // Delta time (վայրկյաններով)
  const dt = Math.min(clock.getDelta(), 0.05); // cap 50ms
  const time = performance.now();

  // --- Updates ---
  if (gameState.running) {
    updatePhysics(dt);
    checkMissionProgress();
  }

  updateCamera(dt);
  animateMarkers(time);
  updateHUD();
  updateDirectionArrow();
  updateMissionDistance();

  // --- Render ---
  renderer.render(scene, camera);

  // --- Minimap (ավելի դանդաղ՝ 30fps) ---
  if (Math.floor(time / 33) !== Math.floor((time - dt * 1000) / 33)) {
    drawMinimap();
  }
}

// ========== START GAME ==========
function startGame() {
  // Թաքցնում ենք start screen-ը
  const startScreen = document.getElementById('startScreen');
  startScreen.classList.add('hide');

  // Վերականգնում ենք state-ը
  gameState.running = true;
  gameState.startTime = Date.now();
  gameState.score = 0;
  gameState.delivered = 0;

  // Խաղացողի սկզբնական դիրք
  player.position.set(0, 0, 20);
  playerState.speed = 0;
  playerState.heading = 0;

  // HUD-ի reset
  document.getElementById('score').textContent = '0';
  document.getElementById('delivered').textContent = '0';
  document.getElementById('timer').textContent = '0:00';

  // Առաջին առաքելությունը
  startNewMission();

  // Ցուցադրում ենք ողջույնի հաղորդագրություն
  showToast('🛵 Բարի գալուստ Երևան');

  // Սկսում ենք loop-ը
  if (!animationId) {
    clock.start();
    gameLoop();
  }
}

// ========== START BUTTON ==========
const startBtn = document.getElementById('startBtn');
startBtn.addEventListener('click', startGame);

// Նաև Enter-ով սկսել
window.addEventListener('keydown', (e) => {
  if (e.code === 'Enter' && !gameState.running) {
    startGame();
  }
});

// ========== INITIAL RENDER (before start) ==========
// Ցուցադրում ենք խաղի աշխարհը start screen-ի հետևում
camera.position.copy(CAM_OFFSET);
camera.lookAt(0, 0, 0);
renderer.render(scene, camera);

// Սկսում ենք loop-ը անմիջապես, բայց physics-ը չի աշխատի
// մինչև startGame-ը չկանչվի
clock.start();
gameLoop();

// ========== FPS COUNTER (optional, dev) ==========
let fpsFrames = 0;
let fpsLastTime = performance.now();
let fpsValue = 60;

function updateFPS() {
  fpsFrames++;
  const now = performance.now();
  if (now - fpsLastTime >= 1000) {
    fpsValue = fpsFrames;
    fpsFrames = 0;
    fpsLastTime = now;
  }
}

// ========== CLEANUP ON PAGE UNLOAD ==========
window.addEventListener('beforeunload', () => {
  if (animationId) {
    cancelAnimationFrame(animationId);
  }
});
